name: YourWork CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Lint & Type Check
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app_src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app_src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./app_src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app_src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: app_src/.next/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Backend Lint & Security Scan
  # ─────────────────────────────────────────────────────────────
  backend-check:
    name: Backend Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No root package.json — skipping backend install"
          fi

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

      - name: Run dependency audit
        run: |
          cd app_src && npm audit --audit-level=high
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Security — OWASP Dependency Check
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend dependencies
        working-directory: ./app_src
        run: |
          npm ci
          npm audit --json > audit-report.json || true
          cat audit-report.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const vulns = data.metadata?.vulnerabilities || {};
            const critical = vulns.critical || 0;
            const high = vulns.high || 0;
            console.log('Critical:', critical, '| High:', high);
            if (critical > 0) process.exit(1);
          "

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: app_src/audit-report.json
          retention-days: 30
        if: always()

  # ─────────────────────────────────────────────────────────────
  # JOB 5: Deploy to Preview (on PRs)
  # ─────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: github.event_name == 'pull_request'
    environment: preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: app_src/.next/

      - name: Deploy to preview environment
        run: |
          echo "🚀 Deploying PR #${{ github.event.pull_request.number }} to preview..."
          echo "Preview URL: https://preview-pr-${{ github.event.pull_request.number }}.yourwork.io"
          # Replace with: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Ready\n\n**Preview URL:** https://preview-pr-${{ github.event.pull_request.number }}.yourwork.io\n\n_Deployed from commit \`${{ github.sha }}\`_`
            })

  # ─────────────────────────────────────────────────────────────
  # JOB 6: Deploy to Production (on main push)
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: app_src/.next/

      - name: Deploy to production
        run: |
          echo "🌐 Deploying to production..."
          echo "Production URL: https://yourwork.io"
          # Replace with: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Notify deployment success
        run: |
          echo "✅ Production deployment complete!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
